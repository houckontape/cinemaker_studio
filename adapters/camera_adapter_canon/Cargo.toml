[package]
name = "camera_adapter_canon"
version = "0.1.0"
edition = "2024"

[lib]
name = "camera_adapter_canon"
crate-type = ["rlib"]

[dependencies]
camera_domain = { path = "../../core/domain/camera_domain" }
camera_ports = { path = "../../core/ports/camera_ports" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
thiserror = "2.0.20"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com"] }

[build-dependencies]

[features]
default = ["windows"]
windows = []
macos = []
